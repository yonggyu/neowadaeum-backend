  # ── §13.9 신고 ──────────────────────────────────────────────
  /api/v1/reports:
    post:
      tags: [report]
      operationId: createReport
      summary: 신고 (세이프티 L3)
      description: |
        세이프티 L3 의 **유일한 사용자 경로**다 (R13.5). Play 화면 Menu 에서 진입한다.

        동일인의 반복 신고는 누적으로 세지 않는다 — `UNIQUE(reporterRef, targetType, targetId)` (§13-9).
        IP 기준 rate limit 이 함께 걸린다 (S-8).
      x-implemented-by: B-57
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '202':
          description: 접수됨. 처리 결과는 통보하지 않는다
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 이미 신고한 대상이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ── §13.10 Landing ──────────────────────────────────────────
  /api/v1/landing:
    get:
      tags: [landing]
      operationId: getLanding
      summary: 랜딩
      description: |
        `isLoggedIn` 을 반환하지 않는다. 클라이언트가 토큰 보유로 판단한다.

        `noticeText` 는 AI 사전 고지 문구이며 **하드코딩하지 않는다** — `service_config` 에서 온다 (R11.1).
      security: []
      x-implemented-by: B-37, B-14
      responses:
        '200':
          description: 추천 작품과 고지 문구
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingResponse'

  # ── §14 Admin — 역할·IP·2FA 를 모두 통과해야 한다 (S-4) ──────
  /api/v1/admin/sessions/{sessionId}/debug:
    get:
      tags: [admin]
      operationId: getSessionDebug
      summary: 세션 디버그
      description: |
        한 세션에서 무슨 일이 일어났는지 본다 — provider · model · gameState · storySummary ·
        최근 턴 · **AI 호출 원문** · 사용량.

        **세 조건이 AND 다** (S-4). 액세스 토큰만으로는 열리지 않는다 — `X-Admin-Step-Up` 이
        함께 와야 하며, 그 값은 `POST /api/v1/admin/2fa/verify` 가 발급한다.

        **원문을 읽으면 기록된다** (R12.3, S-5). 읽은 건마다 `access_audit_log` 에 한 줄이
        남고, **기록하지 못하면 원문도 나가지 않는다.**

        지운 세션도 보인다 — 무슨 일이 있었는지 보는 것이 목적이고, 지워졌다는 사실도 그 일부다.

        `playerRef` 는 응답에 없다 (I-3). 관리자가 알아야 하는 것은 세션에서 일어난 일이지
        그것이 누구인지가 아니다.
      x-implemented-by: B-41
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/AdminStepUp'
      responses:
        '200':
          description: 세션 상태와 AI 호출 원문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionDebugResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/sessions/{sessionId}/rollback:
    post:
      tags: [admin]
      operationId: rollbackSession
      summary: 세션 되돌리기
      description: |
        `toTurnNo` 까지 되돌린다. **그 턴은 남는다** — 되돌린 뒤 화면에 떠 있을 턴이다.

        **`game_state_snapshot` 과 `story_summary` 를 함께 되돌린다** (R14.4). 둘 중 하나만
        접히면 상태와 이야기가 다른 지점을 가리킨 채 다음 턴이 만들어진다.

        **지우지 않는다** (I-5). 접힌 턴·스냅샷·요약은 `deleted_at` 만 찍힌 채 남는다.

        끝난 세션을 되돌리면 `completed_at` 과 `current_ending_id` 도 함께 비워진다 — 남겨 두면
        **끝난 세션이 계속 진행되는** 상태가 된다.
      x-implemented-by: B-42
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/AdminStepUp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
      responses:
        '200':
          description: 무엇을 어디까지 되돌렸나
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/sessions/{sessionId}/turns/{turnNo}/regenerate:
    post:
      tags: [admin]
      operationId: regenerateTurn
      summary: 턴 재생성
      description: |
        되돌린 뒤 §4.3 의 **같은 파이프라인**으로 다시 만든다. 관리자용 생성 경로를 따로 두면
        두 곳이 서서히 갈라지고, **디버그에서 본 것이 사용자가 겪는 것과 달라진다.**

        **같은 선택으로 다시 만든다** — 재생성은 *그 선택에서 다른 본문*을 보는 것이지 다른
        선택을 해 보는 것이 아니다. 순서 또한 서버가 저장해 둔 값에서 되찾는다 (I-1).

        **결과가 같을 수 있다.** 다른 본문을 약속하지 않는다.

        세이프티에 걸리면 본문이 저장되지 않고(I-2) 세션은 `turnNo - 1` 에 남는다.
        그때 `blocked` 가 `true` 다.

        자세한 것은 `docs/corrections.md` §13-30.
      x-implemented-by: B-42
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: turnNo
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/AdminStepUp'
      responses:
        '200':
          description: 다시 만든 결과. **본문은 담지 않는다** — 디버그를 다시 부른다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegenerateResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/sessions/{sessionId}/turns/free:
    post:
      tags: [admin]
      operationId: submitAdminFreeInput
      summary: 관리자 자유입력
      description: |
        선택지 대신 **임의의 행동 문장**으로 다음 턴을 만든다 (R14.2). 선택지만으로는 재현되지
        않는 상황을 재현하기 위한 것이다.

        **테스트 세션에서만 열린다** (I-18, R14.3). 사용자 소유 세션에서는 `403` 이며, 그런
        세션에 대해서는 읽기 전용 디버그까지다 — 남의 이야기에 관리자가 문장을 넣는 것은
        디버그가 아니라 개입이다.

        **L1 검수를 반드시 지난다** (I-17, R14.1). 디버그 목적이어도 무검열 통로를 만들지
        않는다 — 통로가 하나 있으면 그것이 곧 그 서비스의 실제 등급이 된다. 걸리면 `422`
        이며 **어디에 걸렸는지는 알리지 않는다** (S-6, S-11).

        만들어진 턴은 `is_admin_free_input = true` 로 남는다 (R14.2). 본문을 만든 것은 여전히
        AI 이며, 이 표시는 **이번 턴의 행동이 어디서 왔는가**를 가리킨다.

        생성은 §4.3 의 **같은 파이프라인**을 탄다 — 전용 경로를 만들면 관리자가 재현한 것이
        사용자가 겪는 것과 달라진다.
      x-implemented-by: B-43
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/AdminStepUp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeInputRequest'
      responses:
        '200':
          description: 만들어진 턴. **본문은 담지 않는다** — 디버그로 본다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeInputResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/SafetyBlocked'

  /api/v1/admin/blocklist:
    get:
      tags: [admin]
      operationId: listBlocklist
      summary: 블록리스트 목록
      description: |
        무엇이 등록돼 있는가. **이 응답 자체가 세 조건 뒤에 있다** (S-4) — 목록이 곧 우회
        사전이므로 그 밖으로는 나가지 않는다.

        **정규화 값은 나가지 않는다.** 그것은 대조에만 쓰는 내부 표현이며, 내보내면
        정규화가 무엇을 어떻게 모으는지가 드러난다.
      x-implemented-by: B-49
      parameters:
        - $ref: '#/components/parameters/AdminStepUp'
      responses:
        '200':
          description: 등록된 항목. 최근 것부터
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlocklistEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      operationId: registerBlocklistEntry
      summary: 블록리스트 등록
      description: |
        **정규화는 서버가 한다** (R2.5). 요청은 사람이 읽는 값만 나른다 — 클라이언트가 보낸
        정규화 값을 믿으면, 그 값을 비워 보내는 것만으로 **걸리지 않는 항목**을 등록할 수
        있다. 등록했다고 믿게 만드는 가장 조용한 방법이다.

        **등록하면 다음 판정부터 걸린다** (R9.4). 캐시가 갱신을 삼키지 않는다.

        정규화하면 빈 값이 되는 입력은 `400` 이다 — 문장부호만으로 이뤄진 항목은 모든
        문자열에 걸리거나 아무것에도 걸리지 않는다.

        `severity: warn` 은 **판정으로 나가지 않는다** (§13-31). 경고의 자리는 작성 중
        안내(L0)이며, 판정기는 걸린 항목을 곧바로 차단으로 다루므로 함께 내보내면
        경고가 차단이 된다.
      x-implemented-by: B-49
      parameters:
        - $ref: '#/components/parameters/AdminStepUp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlocklistRegisterRequest'
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocklistEntry'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 같은 정규화 값이 이미 있다 (R2.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: ALREADY_EXISTS
                message: 이미 등록되어 있어요.
                details: {}

  /api/v1/admin/blocklist/{entryId}:
    delete:
      tags: [admin]
      operationId: removeBlocklistEntry
      summary: 블록리스트 삭제
      description: |
        **없어도 성공이다** — 삭제는 상태를 맞추는 요청이고, 두 번째 호출이 실패하면
        클라이언트가 재시도할 방법이 없다.

        지우면 다음 판정부터 걸리지 않는다.
      x-implemented-by: B-49
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AdminStepUp'
      responses:
        '204':
          description: 삭제됨. 본문 없음
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/2fa/enroll:
    post:
      tags: [admin]
      operationId: enrollAdminTotp
      summary: 관리자 2FA 등록 시작
      description: |
        **비밀이 나가는 유일한 응답이다.** 이후로는 어떤 경로로도 다시 볼 수 없다.

        아직 등록하지 않은 관리자는 승격 없이 부를 수 있다 — 요구하면 **등록할 방법 자체가
        없어진다.** 이미 확정된 등록이 있으면 `X-Admin-Step-Up` 을 요구한다: 재등록은 2FA 를
        갈아 치우는 행위이므로 그 자체가 2FA 뒤에 있어야 한다.
      x-implemented-by: B-40
      parameters:
        - $ref: '#/components/parameters/AdminStepUp'
      responses:
        '200':
          description: 인증기에 넣을 비밀
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollmentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/2fa/confirm:
    post:
      tags: [admin]
      operationId: confirmAdminTotp
      summary: 관리자 2FA 등록 확정
      description: |
        인증기가 만든 코드로 **실제로 들어갔는지** 확인한다. 이 코드가 맞아야 비로소 그 비밀이
        문을 연다.

        확정은 곧바로 승격을 준다 — 방금 코드를 맞힌 사람에게 다시 묻는 것은 아무것도 더
        확인하지 못한다.
      x-implemented-by: B-40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        '200':
          description: 단계 승격
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpStepUpResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/2fa/verify:
    post:
      tags: [admin]
      operationId: verifyAdminTotp
      summary: 관리자 2FA 검증
      description: |
        승격을 만들어 내는 유일한 경로다. 관리자 경로는 그 값을 `X-Admin-Step-Up` 으로 보낸다.

        **같은 코드는 두 번 통하지 않는다** — 코드는 30초 동안 같으므로, 재사용을 막지 않으면
        어깨너머로 본 여섯 자리가 그 창 안에서 몇 번이든 쓰인다.

        실패는 전부 `403` 하나다. 등록 없음·확정 전·코드 불일치·재사용을 구분해 알리면 그것이
        곧 단서다 (S-6).
      x-implemented-by: B-40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        '200':
          description: 단계 승격
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpStepUpResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '`Authorization: Bearer <accessToken>`'

  parameters:
    AdminStepUp:
      name: X-Admin-Step-Up
      in: header
      required: false
      description: |
        2FA 검증이 발급한 단계 승격 토큰 (S-4).

        **`Authorization` 에 겹쳐 싣지 않는다** — 그 자리는 *누구인가*를 답하고 이것은 *방금
        두 번째 요소를 통과했는가*를 답한다.

        `required: false` 인 것은 등록 경로 때문이다. 없으면 대부분의 관리자 경로가 `403` 이다.
      schema:
        type: string
    StoryId:
      name: storyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SectionKey:
      name: sectionKey
      in: path
      required: true
      schema:
        type: string
      description: '`recommended` | `genre:<key>` | `community`'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  responses:
    ConsentRequired:
      description: '`birthDate` 또는 `consents[]` 누락 (§13.1)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: CONSENT_REQUIRED
            message: 가입을 계속하려면 추가 정보가 필요해요.
            details: {}
    ValidationError:
      description: 입력 검증 실패. `details.fields` 에 필드별 사유가 온다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: VALIDATION_ERROR
            message: 입력값을 확인해 주세요.
            details:
              fields:
                turnNo: must be greater than or equal to 0
    InvalidChoice:
      description: '`choiceId` 가 직전 턴이 발급한 것이 아니다 (I-1)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: INVALID_CHOICE
            message: 선택할 수 없는 항목이에요. 화면을 새로 불러와 주세요.
            details: {}
    Unauthenticated:
      description: 토큰 없음 또는 만료
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: UNAUTHENTICATED
            message: 로그인이 필요해요.
            details: {}
    AgeRestricted:
      description: 만 15세 미만 (R10.2). 계정을 만들지 않는다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: AGE_RESTRICTED
            message: 만 15세부터 이용할 수 있어요.
            details: {}
    Forbidden:
      description: 소유자가 아니거나 지금 수행할 수 없는 작업이다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: FORBIDDEN
            message: 이 작업을 수행할 권한이 없어요.
            details: {}
    NotFound:
      description: 리소스 없음. **어떤 리소스인지 밝히지 않는다** — 존재 여부 자체가 정보다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: NOT_FOUND
            message: 요청하신 정보를 찾을 수 없어요.
            details: {}
    SessionAlreadyActive:
      description: 작품당 active 세션은 1개다 (§13-9). `restart=true` 로 다시 시작할 수 있다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: SESSION_ALREADY_ACTIVE
            message: 이미 진행 중인 이야기가 있어요.
            details: {}
    SafetyBlocked:
      description: |
        Safety L2 차단 (I-2, §9.3).

        **"다시 시도"를 제공하지 않는다** (R9.5) — 동일 입력이므로 같은 결과가 나와 무한 루프가 된다.
        **차단 사유를 담지 않는다** (R9.6) — 어떤 표현이 걸렸는지 알려주면 우회 학습을 돕는다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: SAFETY_BLOCKED
            message: 이 방향으로는 이야기를 이어갈 수 없어요.
            details:
              turnNo: 12
              recoverable: true
              actions: [choose_other, leave]
    StorySuspended:
      description: 작품이 정지되어 새 턴을 만들 수 없다. 기존 기록 열람은 허용된다 (R8.10)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: STORY_SUSPENDED
            message: 지금은 이 작품을 이어갈 수 없어요.
            details: {}
    TooManyRequests:
      description: |
        **429 는 셋으로 구분한다** (§13-14d). 하나로 합치지 않는다 — 클라이언트 처리가 다르다.

        - `RETRY_COOLDOWN` — 연속 실패 3회. `details.retryAfterSeconds` 동안 재시도 비활성
        - `RATE_LIMITED` — 분당 호출 한도 초과
        - `QUOTA_EXCEEDED` — 일일 토큰·생성 한도 초과
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            retryCooldown:
              value:
                error: RETRY_COOLDOWN
                message: 잠시 후 다시 시도해 주세요.
                details:
                  retryAfterSeconds: 30
            rateLimited:
              value:
                error: RATE_LIMITED
                message: 요청이 너무 빨라요. 잠시 후 다시 시도해 주세요.
                details: {}
            quotaExceeded:
              value:
                error: QUOTA_EXCEEDED
                message: 오늘 이용할 수 있는 양을 모두 사용했어요.
                details: {}
    InternalError:
      description: |
        서버 결함. `CONTEXT_BUDGET_EXCEEDED` 는 컨텍스트 예산 초과이며 **조용히 잘라내지 않고 실패시킨다** (§4.4).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internal:
              value:
                error: INTERNAL_ERROR
                message: 일시적인 문제가 발생했어요.
                details: {}
            contextBudget:
              value:
                error: CONTEXT_BUDGET_EXCEEDED
                message: 일시적인 문제가 발생했어요.
                details: {}
    ProviderError:
      description: Provider 실패 또는 스키마 파싱 재요청 실패 (R3.3, R5.8)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: PROVIDER_ERROR
            message: 이야기를 만들지 못했어요. 잠시 후 다시 시도해 주세요.
            details: {}
    GenerationTimeout:
      description: 생성 예산 초과 (R6.4). **세션 상태는 변하지 않는다** (R6.6)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: GENERATION_TIMEOUT
            message: 이야기를 만드는 데 시간이 너무 오래 걸렸어요.
            details: {}

  schemas:

    # ── 공통 ────────────────────────────────────────────────
    ErrorCode:
      type: string
      description: |
        서버가 내보내는 모든 에러의 `error` 값. `com.neowadaeum.common.error.ErrorCode` 와 **정확히 일치**한다.
        스펙에 없는 코드를 만들지 않는다.
      enum:
        - CONSENT_REQUIRED
        - INVALID_CHOICE
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - AGE_RESTRICTED
        - FORBIDDEN
        - NOT_FOUND
        - TURN_CONFLICT
        - CONCURRENT_GENERATION
        - SESSION_ALREADY_ACTIVE
        - ALREADY_EXISTS
        - SAFETY_BLOCKED
        - STORY_SUSPENDED
        - RETRY_COOLDOWN
        - RATE_LIMITED
        - QUOTA_EXCEEDED
        - CONTEXT_BUDGET_EXCEEDED
        - INTERNAL_ERROR
        - PROVIDER_ERROR
        - GENERATION_TIMEOUT

    Error:
      type: object
      description: |
        **모든 에러가 이 형태 하나로 수렴한다.**

        스택트레이스·예외 클래스명·SQL·내부 경로·세이프티 차단 사유·거절된 입력 원문을 담지 않는다 (S-6, R9.6, S-3).
        클라이언트는 `error` 코드로 문구를 매핑한다. 서버 `message` 를 UI 에 그대로 쓴다고 가정하지 않는다.
      required: [error, message, details]
      properties:
        error:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 안전한 폴백 문구
        details:
          type: object
          additionalProperties: true
          description: 코드별 부가 정보. **`null` 이 되지 않는다** — 값이 없으면 빈 객체다

    AuthorType:
      type: string
      enum: [official, user]
      description: 공식 작품과 사용자 작품을 같은 섹션에 섞지 않는 근거 (R13.1)

    Visibility:
      type: string
      enum: [private, unlisted, public]

    ReviewStatus:
      type: string
      description: |
        `draft → pending → (auto_rejected | in_review) → (approved | rejected)`,
        `approved → suspended → (approved | rejected)` (§13-9).
        `auto_rejected` 는 내부 기록이며 사용자에게는 `rejected` 로 표시한다.
      enum: [draft, pending, auto_rejected, in_review, approved, rejected, suspended]

    # ── §13.1 인증 ──────────────────────────────────────────
    OAuthLoginRequest:
      type: object
      description: |
        `birthDate` / `consents` 는 **최초 로그인(가입)에만** 필요하다. 기존 회원은 `idToken` 만 보낸다.
        누락이면 `400 CONSENT_REQUIRED` 로 무엇이 더 필요한지 알린다.
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Provider 가 발급한 ID 토큰. 서버가 검증한다
        birthDate:
          type: [string, 'null']
          format: date
          description: 만 나이 계산은 KST 기준이다. 원본을 저장한다(생일 경과 처리)
        consents:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ConsentItem'

    ConsentItem:
      type: object
      required: [consentType, version, agreed]
      properties:
        consentType:
          type: string
          enum: [tos, privacy, ai_notice, age]
        version:
          type: string
        agreed:
          type: boolean

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenResponse:
      type: object
      description: '`playerRef` 를 반환하지 않는다. 클라이언트가 알 필요가 없다'
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: 액세스 토큰 만료까지 남은 초

    # ── §13.2 Library ───────────────────────────────────────
    LibraryResponse:
      type: object
      required: [genres, sections, continueSessions]
      properties:
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/LibrarySection'
        continueSessions:
          type: array
          items:
            $ref: '#/components/schemas/ContinueSession'

    Genre:
      type: object
      required: [genreId, label]
      properties:
        genreId:
          type: string
        label:
          type: string

    LibrarySection:
      type: object
      required: [sectionKey, sectionTitle, hasMore, stories]
      properties:
        sectionKey:
          type: string
          description: '`recommended` | `genre:<key>` | `community`'
        sectionTitle:
          type: string
        hasMore:
          type: boolean
        stories:
          type: array
          items:
            $ref: '#/components/schemas/StoryCard'
        nextCursor:
          type: [string, 'null']

    StoryCard:
      type: object
      required: [storyId, title, coverImage, genres, shortDescription, isNew, authorType]
      properties:
        storyId:
          type: string
          format: uuid
        title:
          type: string
        coverImage:
          type: [string, 'null']
          description: 2:3 비율
        genres:
          type: array
          items:
            type: string
        shortDescription:
          type: string
          description: 40자 이하
        isNew:
          type: boolean
        authorType:
          $ref: '#/components/schemas/AuthorType'

    ContinueSession:
      type: object
      description: 진행률을 백분율로 주지 않는다 (R13.2)
      required: [sessionId, storyId, title, coverImage, chapterNo, chapterTitle, totalChapters, lastSceneSummary, updatedAt]
      properties:
        sessionId:
          type: string
          format: uuid
        storyId:
          type: string
          format: uuid
        title:
          type: string
        coverImage:
          type: [string, 'null']
        chapterNo:
          type: integer
        chapterTitle:
          type: [string, 'null']
        totalChapters:
          type: integer
        lastSceneSummary:
          type: [string, 'null']
        updatedAt:
          type: string
          format: date-time

    # ── §13.3 Story Detail ──────────────────────────────────
    StoryDetailResponse:
      type: object
      required: [story, characters, mySession]
      properties:
        story:
          $ref: '#/components/schemas/StoryDetail'
        characters:
          type: array
          description: 빈 배열이면 클라이언트가 섹션을 숨긴다
          items:
            $ref: '#/components/schemas/CharacterCard'
        mySession:
          oneOf:
            - $ref: '#/components/schemas/MySessionBrief'
            - type: 'null'

    StoryDetail:
      type: object
      required: [storyId, title, heroImage, genres, description, worldIntro, ageRating, authorType, authorDisplayName, totalChapters, totalEndings]
      properties:
        storyId:
          type: string
          format: uuid
        title:
          type: string
        heroImage:
          type: [string, 'null']
        genres:
          type: array
          items:
            type: string
        description:
          type: string
        worldIntro:
          type: string
        ageRating:
          type: string
          const: 15세 이용가
          description: '**상수다** (R10.1, I-19). 작품별 등급 컬럼을 두지 않는다'
        authorType:
          $ref: '#/components/schemas/AuthorType'
        authorDisplayName:
          type: [string, 'null']
          description: UGC 작성자 닉네임 (§13-7). **`playerRef` 를 노출하지 않는다**
        totalChapters:
          type: integer
        totalEndings:
          type: integer
          description: '`isSecret = false` 인 엔딩만 센다 (R7.11)'

    CharacterCard:
      type: object
      required: [characterId, name, role, portraitImage, oneLine]
      properties:
        characterId:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: [string, 'null']
        portraitImage:
          type: [string, 'null']
        oneLine:
          type: [string, 'null']

    MySessionBrief:
      type: object
      required: [sessionId, chapterNo, chapterTitle, lastSceneSummary]
      properties:
        sessionId:
          type: string
          format: uuid
        chapterNo:
          type: integer
        chapterTitle:
          type: [string, 'null']
        lastSceneSummary:
          type: [string, 'null']

    # ── §13.4 Session ───────────────────────────────────────
    StartSessionResponse:
      type: object
      description: 턴 1 이 함께 온다. 시작 직후 별도 턴 요청이 필요 없다
      required: [sessionId, turn]
      properties:
        sessionId:
          type: string
          format: uuid
        turn:
          $ref: '#/components/schemas/TurnResponse'

    SessionState:
      type: string
      description: |
        `valid` 만 이어하기가 가능하다.
        `version_changed` 는 세션이 고정 참조하는 버전이 `story.currentVersionId` 와 달라진 경우다 (R2.1).
        `story_suspended` 는 UGC 정지다 (R13.3).
      enum: [valid, expired, deleted, version_changed, story_suspended]

    ResumeResponse:
      type: object
      required: [sessionId, storyId, title, chapterNo, chapterTitle, totalChapters, turnNo, updatedAt, lastSceneVisual, lastSceneSummary, lastChoiceText, sessionState, canViewHistory]
      properties:
        sessionId:
          type: string
          format: uuid
        storyId:
          type: string
          format: uuid
        title:
          type: string
        chapterNo:
          type: integer
        chapterTitle:
          type: [string, 'null']
        totalChapters:
          type: integer
        turnNo:
          type: integer
        updatedAt:
          type: string
          format: date-time
        lastSceneVisual:
          type: [string, 'null']
        lastSceneSummary:
          type: [string, 'null']
        lastChoiceText:
          type: [string, 'null']
        sessionState:
          $ref: '#/components/schemas/SessionState'
        canViewHistory:
          type: boolean

    # ── §13.5 Turn ──────────────────────────────────────────
    TurnRequest:
      type: object
      description: |
        **사용자 입력면은 이 둘뿐이다.** 플레이 중 자유입력이 없고(I-18), 선택지는 서버가 발급한
        `choiceId` 로만 제출된다 (I-1). 선택지 텍스트를 받는 필드를 두지 않는다.
      required: [choiceId, turnNo]
      properties:
        choiceId:
          type: string
          description: |
            직전 턴이 발급한 선택지 식별자. 형식은 `{turnNo}-{order}-{shortHash}` 이며 세션 안에서 유일하다.
            **이전 턴의 `choiceId` 는 재사용할 수 없다** (§13-9).
          examples: ['12-2-1a2b3c4d']
        turnNo:
          type: integer
          minimum: 0
          description: '**지금 화면에 떠 있는 턴**의 번호. 낙관적 잠금 키다 (I-6)'

    TurnResponse:
      type: object
      description: |
        `progressPercent` 를 만들지 않는다 (R7.5) — AI 생성이라 챕터당 턴 수가 가변이므로 백분율에 근거가 없다.

        엔딩이면 `isEnding: true` 이고 `choices` 는 **빈 배열**이다 (R7.8).
      required: [turnNo, chapterNo, chapterTitle, chapterChanged, progressHint, speakerName, paragraphs, choices, isEnding, endingId, endingIndex, totalEndings]
      properties:
        turnNo:
          type: integer
          description: '**요청값 + 1** 이다 (§13-14e)'
        chapterNo:
          type: integer
          description: '**서버가 판정한** 챕터. AI 제안값은 반영하지 않는다 (I-9, I-10)'
        chapterTitle:
          type: [string, 'null']
        chapterChanged:
          type: boolean
          description: 전환 시 클라이언트가 인터스티셜을 띄운다 (R7.3)
        progressHint:
          type: [string, 'null']
          examples: ['Chapter 4 / 전체 6장']
        speakerName:
          type: [string, 'null']
          description: 턴의 대표 화자. 없으면 나레이션만 있는 턴이다
        paragraphs:
          type: array
          description: '**통 문자열이 아니라 문단 배열이다** (R5.1). 대사와 나레이션을 다르게 렌더한다 (R5.2)'
          items:
            $ref: '#/components/schemas/Paragraph'
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
        isEnding:
          type: boolean
        endingId:
          type: [string, 'null']
          format: uuid
        endingIndex:
          type: [integer, 'null']
          description: 비시크릿 기준 순번. 시크릿 엔딩이면 `null` 이다 (R7.11)
        totalEndings:
          type: [integer, 'null']
          description: 비시크릿 엔딩 수 (R7.11)
        sceneImage:
          type: [string, 'null']
          description: 아직 발행하지 않는다
          x-implemented-by: P3
        savedAt:
          type: [string, 'null']
          format: date-time
          x-implemented-by: B-17
        isAiGenerated:
          type: [boolean, 'null']
          description: '상수 `true` 가 아니라 **실제 생성 경로를 반영한다** (R11.2)'
          x-implemented-by: B-14
        canViewHistory:
          type: [boolean, 'null']
          x-implemented-by: B-35
        endingLabel:
          type: [string, 'null']
          x-implemented-by: B-17
        epilogueText:
          type: [string, 'null']
          x-implemented-by: B-17
        reachRate:
          type: [number, 'null']
          description: |
            도달률. **배치 갱신값이다** (I-20, R2.7). 표본이 적으면 `null` 을 반환한다 (R2.8).
          x-implemented-by: B-39
        stats:
          oneOf:
            - $ref: '#/components/schemas/EndingStats'
            - type: 'null'
          x-implemented-by: B-17
        replayable:
          type: [boolean, 'null']
          x-implemented-by: B-17

    Paragraph:
      type: object
      required: [type, speakerName, text]
      properties:
        type:
          type: string
          enum: [dialogue, narration]
        speakerName:
          type: [string, 'null']
          description: '`null` 이면 나레이션으로 렌더한다 (R5.2)'
        text:
          type: string

    Choice:
      type: object
      description: |
        `choiceId` 는 **서버가 발급한 값이다** (I-1). 다음 요청은 이것만 보낸다.

        `disabled` 도 **서버가 판정한다** (I-11). P0 채택안대로 항상 `false` 이고 `disabledReason` 은
        `null` 이지만 **필드는 유지한다** — 프론트 계약 안정성 때문이다 (§13-3).
      required: [choiceId, order, text, disabled, disabledReason]
      properties:
        choiceId:
          type: string
        order:
          type: integer
          minimum: 1
        text:
          type: string
        disabled:
          type: boolean
        disabledReason:
          type: [string, 'null']

    EndingStats:
      type: object
      required: [chapters, turns, choices]
      properties:
        chapters:
          type: integer
        turns:
          type: integer
        choices:
          type: integer

    # ── §13.6 History ───────────────────────────────────────
    HistoryResponse:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    HistoryItem:
      type: object
      description: '**`choiceId` 를 반환하지 않는다.** 읽기 전용이다'
      required: [turnNo, chapterNo, chapterTitle, speakerName, paragraphs, chosenChoiceText, isPending]
      properties:
        turnNo:
          type: integer
        chapterNo:
          type: integer
        chapterTitle:
          type: [string, 'null']
        speakerName:
          type: [string, 'null']
        paragraphs:
          type: array
          items:
            $ref: '#/components/schemas/Paragraph'
        chosenChoiceText:
          type: [string, 'null']
        isPending:
          type: boolean
          description: '마지막 턴이며 아직 선택이 이뤄지지 않은 경우 `true` (§13-9)'

    # ── §13.7 My Stories ────────────────────────────────────
    MySessionsResponse:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MySessionItem'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    MySessionItem:
      type: object
      required: [sessionId, storyId, title, coverImage, status, chapterNo, totalChapters, updatedAt]
      properties:
        sessionId:
          type: string
          format: uuid
        storyId:
          type: string
          format: uuid
        title:
          type: string
        coverImage:
          type: [string, 'null']
        status:
          type: string
          enum: [active, completed]
          description: '§13-6 정정. `in_progress` 는 존재하지 않는 상태였다'
        chapterNo:
          type: integer
        totalChapters:
          type: integer
        updatedAt:
          type: string
          format: date-time

    MyStoriesResponse:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyStoryItem'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    MyStoryItem:
      type: object
      required: [storyId, title, coverImage, visibility, reviewStatus, rejectReasons, playCount, updatedAt]
      properties:
        storyId:
          type: string
          format: uuid
        title:
          type: string
        coverImage:
          type: [string, 'null']
        visibility:
          $ref: '#/components/schemas/Visibility'
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        rejectReasons:
          type: array
          description: '**카테고리만** 담는다. 어떤 표현이 걸렸는지는 노출하지 않는다 (R8.7)'
          items:
            type: string
        playCount:
          type: integer
        updatedAt:
          type: string
          format: date-time

    # ── §13.8 작품 만들기 ───────────────────────────────────
    SafetyState:
      type: string
      enum: [clean, warned, blocked]

    DraftResponse:
      type: object
      required: [draftId, step, safetyState, findings, updatedAt]
      properties:
        draftId:
          type: string
          format: uuid
        storyId:
          type: [string, 'null']
          format: uuid
        step:
          type: integer
          minimum: 1
          maximum: 5
        payload:
          type: object
          additionalProperties: true
          description: 단계별 입력 원문 (§8.1)
        safetyState:
          $ref: '#/components/schemas/SafetyState'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        updatedAt:
          type: string
          format: date-time

    DraftPatchRequest:
      type: object
      required: [step, payload]
      properties:
        step:
          type: integer
          minimum: 1
          maximum: 5
        payload:
          type: object
          additionalProperties: true

    PrecheckRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: object
          additionalProperties:
            type: string
          description: 검사할 필드 경로 → 값. 예 `characters[0].name`

    PrecheckResponse:
      type: object
      required: [state, findings]
      properties:
        state:
          $ref: '#/components/schemas/SafetyState'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'

    Finding:
      type: object
      description: |
        위반 **위치와 사유**를 담는다 (R8.2). "부적절한 내용입니다"가 아니라 무엇이 문제인지 보여야 한다.

        단 **걸린 항목 자체는 담지 않는다** — 우회 학습을 돕는다 (R8.7, S-11).
      required: [field, span, kind, message]
      properties:
        field:
          type: string
          examples: ['characters[0].name']
        span:
          type: array
          description: '[시작, 끝) 문자 오프셋'
          items:
            type: integer
          minItems: 2
          maxItems: 2
        kind:
          type: string
          enum: [real_person, ip_violation, sexual, violence, hate, personal_data, other]
        message:
          type: string

    OutlineResponse:
      type: object
      required: [chapters, endings]
      properties:
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/OutlineChapter'
        endings:
          type: array
          items:
            $ref: '#/components/schemas/OutlineEnding'

    OutlineChapter:
      type: object
      required: [chapterNo, title, summarySeed]
      properties:
        chapterNo:
          type: integer
        title:
          type: string
        summarySeed:
          type: string
        conditionTemplateKey:
          type: [string, 'null']
          description: 조건은 **템플릿 선택만** 한다 (R7.16). 사용자가 DSL 을 직접 쓰지 않는다

    OutlineEnding:
      type: object
      required: [endingNo, label, isDefault]
      properties:
        endingNo:
          type: integer
        label:
          type: string
        epilogueText:
          type: [string, 'null']
        isDefault:
          type: boolean
          description: |
            기본 엔딩은 조건을 갖지 않고, 일반 엔딩은 조건을 반드시 갖는다 (R2.11, §13-16).
        conditionTemplateKey:
          type: [string, 'null']

    SubmitRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: '#/components/schemas/Visibility'

    VisibilityRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: '#/components/schemas/Visibility'

    ReviewStatusResponse:
      type: object
      description: |
        검수 **비율·임계값을 노출하지 않는다.** 값을 알면 그 아래로 관리할 수 있다 (§13-12, S-11).
      required: [storyId, reviewStatus, visibility, rejectReasons, updatedAt]
      properties:
        storyId:
          type: [string, 'null']
          format: uuid
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        visibility:
          $ref: '#/components/schemas/Visibility'
        rejectReasons:
          type: array
          description: '카테고리만 (R8.7)'
          items:
            type: string
        updatedAt:
          type: string
          format: date-time

    # ── §13.9 신고 ──────────────────────────────────────────
    ReportRequest:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType:
          type: string
          enum: [turn, story]
        targetId:
          type: string
        sessionId:
          type: [string, 'null']
          format: uuid
        turnNo:
          type: [integer, 'null']
        reason:
          type: string
          enum: [inappropriate, ip_violation, real_person, other]
        detail:
          type: [string, 'null']

    # ── §13.10 Landing ──────────────────────────────────────
    LandingResponse:
      type: object
      description: '`isLoggedIn` 을 반환하지 않는다. 클라이언트가 토큰 보유로 판단한다'
      required: [featuredStories, noticeText]
      properties:
        featuredStories:
          type: array
          items:
            $ref: '#/components/schemas/FeaturedStory'
        noticeText:
          type: string
          description: AI 사전 고지 문구. **하드코딩하지 않는다** — `service_config` 에서 온다 (R11.1)

    FeaturedStory:
      type: object
      required: [storyId, title, coverImage]
      properties:
        storyId:
          type: string
          format: uuid
        title:
          type: string
        coverImage:
          type: [string, 'null']

    # ── §14 Admin ────────────────────────────────────────────
    AdminSessionDebugResponse:
      type: object
      description: |
        두 모듈이 준 것을 나란히 둔다. 합쳐서 평평한 하나로 만들면 어느 쪽이 무엇을 준 것인지가
        사라지고, 한쪽이 바뀔 때 다른 쪽 필드까지 흔들린다.
      required: [session, aiCalls]
      properties:
        session:
          $ref: '#/components/schemas/AdminSessionDebugSession'
        aiCalls:
          type: array
          description: AI 호출 원문과 사용량. **최신이 앞이다**
          items:
            $ref: '#/components/schemas/AdminAiCall'

    AdminSessionDebugSession:
      type: object
      description: |
        세션의 현재 상태. **`playerRef` 가 없다** (I-3).

        `gameState` 와 `storySummary` 는 저장된 그대로다 — 디버그는 *저장된 것*을 보는 자리이고,
        다시 가공하면 무엇이 저장돼 있었는지가 흐려진다.
      required: [sessionId, storyId, storyVersionId, status, providerId, modelId, turnNo, chapterNo, testSession, recentTurns, createdAt, updatedAt]
      properties:
        sessionId: { type: string, format: uuid }
        storyId: { type: string, format: uuid }
        storyVersionId:
          type: string
          format: uuid
          description: 세션은 생성 시 이 버전에 고정된다 (I-4)
        status:
          type: string
          enum: [active, completed, abandoned, expired]
        providerId: { type: string }
        modelId: { type: string }
        turnNo:
          type: integer
          description: 지금 화면에 떠 있는 턴
        chapterNo: { type: integer }
        testSession:
          type: boolean
          description: 자유입력은 이 값이 `true` 일 때만 허용된다 (I-18, R14.3)
        gameState:
          type: [string, 'null']
          description: 최신 스냅샷의 JSON 원문. 스냅샷은 append-only 다 (I-5)
        storySummary:
          type: [string, 'null']
        summaryUptoTurnNo:
          type: [integer, 'null']
        recentTurns:
          type: array
          items:
            $ref: '#/components/schemas/AdminDebugTurn'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminDebugTurn:
      type: object
      required: [turnNo, chapterNo, adminFreeInput, ending, createdAt]
      properties:
        turnNo: { type: integer }
        chapterNo: { type: integer }
        speakerName: { type: [string, 'null'] }
        paragraphs:
          type: [string, 'null']
          description: 저장된 JSON 원문
        choices:
          type: [string, 'null']
          description: 저장된 JSON 원문. `choiceId` 는 서버가 발급한 값이다 (I-1)
        chosenChoiceId: { type: [string, 'null'] }
        safetyVerdict:
          type: [string, 'null']
          description: 세이프티 판정 (R9.3). **왜 막혔는지**를 보는 자리다
        adminFreeInput:
          type: boolean
          description: 관리자 자유입력으로 만들어진 턴인가 (R14.2)
        ending: { type: boolean }
        createdAt: { type: string, format: date-time }

    AdminAiCall:
      type: object
      description: |
        AI 호출 한 건 — **원문을 포함한다**.

        이 값을 받은 뒤에도 원문 보관처는 `ai_call_log` 뿐이라는 규칙은 유효하다 (S-3).
      required: [id, purpose, providerId, modelId, requestRaw, attemptNo, createdAt]
      properties:
        id: { type: string, format: uuid }
        purpose:
          type: string
          enum: [turn, summary, safety, outline]
        providerId: { type: string }
        modelId: { type: string }
        fallbackFrom:
          type: [string, 'null']
          description: fallback 이 발동했을 때만 값이 있다 (R3.7). 세션의 provider 고정은 바뀌지 않는다 (I-4)
        requestRaw: { type: string }
        responseRaw: { type: [string, 'null'] }
        inputTokens: { type: [integer, 'null'] }
        outputTokens: { type: [integer, 'null'] }
        latencyMs: { type: [integer, 'null'] }
        costMicro: { type: [integer, 'null'] }
        safetyFlags:
          type: string
          description: 세이프티 판정 결과 배열의 JSON 원문. 통과면 `[]`
        attemptNo:
          type: integer
          description: 재요청은 같은 턴의 별도 호출이다 (R5.8). 1부터 센다
        createdAt: { type: string, format: date-time }

    TotpEnrollmentResponse:
      type: object
      description: 등록을 시작하며 **한 번만** 나가는 값
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: 인증기에 직접 입력하는 표기 (Base32)
        otpauthUri:
          type: string
          description: QR 로 만들 표기. 같은 비밀을 담고 있다

    TotpCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: 인증기가 보여 주는 여섯 자리

    TotpStepUpResponse:
      type: object
      required: [stepUpToken, expiresIn]
      properties:
        stepUpToken:
          type: string
          description: 관리자 요청에 `X-Admin-Step-Up` 으로 함께 보낸다
        expiresIn:
          type: integer
          description: 초. 모르면 만료를 `403` 으로 처음 겪고, 그때는 하던 작업이 이미 끊긴 뒤다

    RollbackRequest:
      type: object
      required: [toTurnNo]
      properties:
        toTurnNo:
          type: integer
          minimum: 0
          description: |
            되돌린 뒤 **남아 있을** 마지막 턴. `0` 은 첫 턴까지 접는다는 뜻이며 허용한다 —
            첫 턴부터 잘못된 세션이 있다.

    RollbackResult:
      type: object
      description: |
        **접은 수를 함께 돌려준다.** 감사에 남길 값이며 (R14.5), "되돌렸다"만으로는 사후에
        무엇이 일어났는지 알 수 없다.
      required: [turnNo, chapterNo, foldedTurns, foldedSnapshots, foldedSummaries]
      properties:
        turnNo: { type: integer }
        chapterNo:
          type: integer
          description: 되돌린 지점의 턴에서 읽는다. `toTurnNo` 가 `0` 이면 1장이다
        foldedTurns: { type: integer }
        foldedSnapshots: { type: integer }
        foldedSummaries:
          type: integer
          description: 스냅샷과 **같은 기준**으로 접힌다 (R14.4)

    RegenerateResult:
      type: object
      required: [turnNo, chapterNo, blocked, ended]
      properties:
        turnNo: { type: integer }
        chapterNo: { type: integer }
        blocked:
          type: boolean
          description: 세이프티에 걸려 저장되지 않았다 (I-2). 세션은 되돌린 자리에 남는다
        ended:
          type: boolean
          description: 다시 만든 턴이 엔딩이었다 (R7.8)

    FreeInputRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            선택지 자리에 들어가는 한 문장. **길이를 제한한다** — 길어질수록 프롬프트에서
            차지하는 몫이 커져 세계관과 최근 턴을 밀어낸다.

            형식만 검증한다. 내용 판정은 L1 이 한다 (I-17).

    FreeInputResult:
      type: object
      required: [turnNo, chapterNo, blocked, ended]
      properties:
        turnNo: { type: integer }
        chapterNo: { type: integer }
        blocked:
          type: boolean
          description: |
            **L2** 에 걸려 저장되지 않았다 (I-2). L1 에 걸린 경우는 `422` 로 끝나므로 여기
            오지 않는다 — 둘은 다른 사건이다.
        ended:
          type: boolean
          description: 만들어진 턴이 엔딩이었다 (R7.8)

    BlocklistRegisterRequest:
      type: object
      required: [kind, value, severity]
      properties:
        kind:
          type: string
          enum: [IP_TITLE, CHARACTER, REAL_PERSON, PHRASE]
          description: |
            **무엇인가**. 왜 막는가(세이프티 분류)와 다른 축이다 — 대응은 §13-31 이 정한다.

            `PHRASE` 는 포괄 항목이다. 더 잘게 나누면 운영자가 어디에 넣을지 매번 고민한다.
        value:
          type: string
          minLength: 1
          maxLength: 200
          description: 사람이 읽는 값. **서버가 여기서 정규화 값을 만든다**
        severity:
          type: string
          enum: [BLOCK, WARN]
          description: '`WARN` 은 판정으로 나가지 않는다 (§13-31)'
        source:
          type: [string, 'null']
          maxLength: 200
          description: 어디서 왔는가. 사후에 근거를 되짚는 데 쓴다

    BlocklistEntry:
      type: object
      description: |
        **정규화 값은 없다.** 대조에만 쓰는 내부 표현이며, 내보내면 정규화가 무엇을 어떻게
        모으는지가 드러난다 — 그 자체가 우회의 재료다.
      required: [id, kind, value, severity]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [ip_title, character, real_person, phrase]
        value: { type: string }
        severity:
          type: string
          enum: [block, warn]
        source: { type: [string, 'null'] }
