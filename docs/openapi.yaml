# ─────────────────────────────────────────────────────────────
# 너와다음 Backend — API 계약 (B-06)
#
# **이 파일이 런타임 진실의 원천이다** (CLAUDE.md Source of Truth).
# 수기로 작성한다. 코드에서 생성하지 않는다 — 생성본은 구현의 사후 기록이지 계약이 아니다.
#
# 출처: backend-requirements.md §13.1~§13.10 (비공개 원문, docs/internal/).
# 정정: docs/corrections.md §13-3 · §13-6 · §13-7 · §13-9 · §13-11 · §13-14.
#
# 규칙
#   - 경로는 /api/v1/... 로 시작한다. 상위 문서 표기를 그대로 따른다.
#   - JSON 은 camelCase, 시간은 UTC ISO-8601. 만 나이 계산만 KST 다.
#   - nullable 필드는 키를 생략하지 않는다. 프론트가 키 존재 여부로 분기하지 않게 한다.
#   - 에러는 전부 Error 한 형태로 수렴한다. error 값은 ErrorCode enum 이다.
#   - S-11 — 이 파일은 공개된다. 운영 도메인·계정 체계·검수 임계값을 적지 않는다.
#     servers 를 비워 두는 것도 그 때문이다(상대 경로로 해석된다).
# ─────────────────────────────────────────────────────────────
openapi: 3.1.0

info:
  title: 너와다음 Backend API
  version: "1.0.0"
  summary: 선택지로 이야기를 이끄는 AI 인터랙티브 스토리 플랫폼
  description: |
    본문은 매 턴 AI 가 생성한다. 플레이 중 자유입력은 없고 사용자 입력면은 `choiceId` 하나뿐이다 (I-1).

    - 서비스 전체 단일 등급 = **15세 이용가**. 작품별 등급이 없다 (R10.1).
    - 모든 AI 응답은 Safety L2 를 통과한 뒤에만 사용자에게 도달한다 (I-2).
    - Chapter 전환과 Ending 선언은 **서버가 GameState 로 판정**한다. AI 제안값은 참고만 한다 (I-10).

    **구현 진행 상태는 이 계약과 다를 수 있다.** 계약이 앞서고 구현이 따라온다.
    `x-implemented-by` 확장이 각 필드·연산의 담당 작업을 가리킨다.
  license:
    name: 비공개
tags:
  - name: auth
    description: 가입·로그인·토큰 재발급 (§13.1)
  - name: library
    description: 라이브러리 (§13.2)
  - name: story
    description: 작품 상세 (§13.3)
  - name: session
    description: 세션 생성·이어하기 (§13.4)
  - name: turn
    description: 턴 생성 — 최우선 경로 (§13.5)
  - name: history
    description: 지난 이야기 (§13.6)
  - name: me
    description: 내 이야기 · 내가 만든 작품 (§13.7)
  - name: authoring
    description: 작품 만들기 (§13.8)
  - name: report
    description: 신고 (§13.9)
  - name: landing
    description: 랜딩 (§13.10)

security:
  - bearerAuth: []

paths:

  # ── §13.1 인증 ──────────────────────────────────────────────
  /api/v1/auth/oauth/{provider}:
    post:
      tags: [auth]
      operationId: loginWithOAuth
      summary: 소셜 로그인 · 가입
      description: |
        최초 로그인이면 계정을 만든다. 이때 `birthDate` 와 `consents[]` 가 함께 와야 한다.

        - `birthDate` 또는 `consents[]` 누락 → `400 CONSENT_REQUIRED`
        - 만 15세 미만 → `403 AGE_RESTRICTED` (R10.2). **계정을 만들지 않는다**
        - 만 나이는 KST 기준으로 계산한다

        **MVP 는 Google 만 구현한다** (§13-11). Apple 은 상위 문서에 있으나 범위 밖이다.
        이메일 가입·로그인(`/auth/email/*`)은 같은 정정으로 계약에서 제외했다.
      security: []
      x-implemented-by: B-12, B-13
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google]
          description: MVP 는 `google` 뿐이다 (§13-11).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLoginRequest'
      responses:
        '200':
          description: 발급된 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ConsentRequired'
        '403':
          $ref: '#/components/responses/AgeRestricted'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: 액세스 토큰 재발급
      security: []
      x-implemented-by: B-12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 재발급된 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # ── §13.2 Library ───────────────────────────────────────────
  /api/v1/library:
    get:
      tags: [library]
      operationId: getLibrary
      summary: 라이브러리 (화면 2.1)
      description: |
        공식 작품과 사용자 작품을 **같은 섹션에 섞지 않는다** (R13.1). `authorType` 이 그 근거다.

        진행률은 `progressPercent` 가 아니라 `chapterNo` / `totalChapters` 로 준다 (R13.2) —
        AI 생성이라 챕터당 턴 수가 가변이므로 백분율에 근거가 없다.
      x-implemented-by: B-15
      responses:
        '200':
          description: 장르 · 섹션 · 이어하기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/library/sections/{sectionKey}:
    get:
      tags: [library]
      operationId: getLibrarySection
      summary: 섹션 단위 재시도
      x-implemented-by: B-15
      parameters:
        - $ref: '#/components/parameters/SectionKey'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 섹션 하나
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── §13.3 Story Detail ──────────────────────────────────────
  /api/v1/stories/{storyId}:
    get:
      tags: [story]
      operationId: getStoryDetail
      summary: 작품 상세 (화면 2.2)
      description: |
        `ageRating` 은 **상수**다. 작품별 등급 컬럼을 두지 않는다 (R10.1, I-19).

        `totalEndings` 는 `isSecret = false` 인 엔딩만 센다 (R7.11).
        UGC 는 `authorDisplayName`(닉네임)을 표시한다. `playerRef` 는 노출하지 않는다 (§13-7).
      x-implemented-by: B-16
      parameters:
        - $ref: '#/components/parameters/StoryId'
      responses:
        '200':
          description: 작품 · 캐릭터 · 내 세션
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── §13.4 Session ───────────────────────────────────────────
  /api/v1/stories/{storyId}/sessions:
    post:
      tags: [session]
      operationId: startSession
      summary: 세션 생성
      description: |
        턴 1 이 함께 만들어진다. 시작 직후 별도 턴 요청이 필요 없다.

        작품당 `active` 세션은 1개다 (§13-9). 이미 있으면 `409 SESSION_ALREADY_ACTIVE` 이며,
        `restart=true` 로 부르면 기존 `active` 세션을 `abandoned` 로 전환한 뒤 새로 만든다.
      x-implemented-by: S-9-2, B-17
      parameters:
        - $ref: '#/components/parameters/StoryId'
        - name: restart
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: true 면 기존 active 세션을 `abandoned` 로 전환하고 새 세션을 만든다 (§13-9).
      responses:
        '201':
          description: 세션과 턴 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SessionAlreadyActive'
        '423':
          $ref: '#/components/responses/StorySuspended'

  /api/v1/sessions/{sessionId}/resume:
    get:
      tags: [session]
      operationId: getResume
      summary: Resume 요약 (화면 2e)
      description: |
        `sessionState` 가 이어하기 가능 여부를 정한다. `version_changed` 는 세션이 고정 참조하는
        `storyVersionId` 가 `story.currentVersionId` 와 달라진 경우다 (R2.1).
        `story_suspended` 는 UGC 정지 시 반환한다 (R13.3, R8.10).
      x-implemented-by: B-17
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Resume 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sessions/{sessionId}/current:
    get:
      tags: [session]
      operationId: getCurrentTurn
      summary: 마지막 턴 복원
      description: 화면을 다시 그릴 때 쓴다. 턴 응답과 같은 형태다.
      x-implemented-by: B-17
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 마지막 턴
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sessions/{sessionId}:
    delete:
      tags: [session]
      operationId: deleteSession
      summary: 세션 삭제
      x-implemented-by: B-17
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: 삭제됨. 본문 없음
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── §13.5 Turn — 최우선 ─────────────────────────────────────
  /api/v1/sessions/{sessionId}/turns:
    post:
      tags: [turn]
      operationId: advanceTurn
      summary: 다음 턴 (화면 2.3)
      description: |
        **턴 번호 계약** (§13-14e) — 요청 `turnNo` 는 *지금 화면에 떠 있는 턴*이고, 응답 `turnNo` 는
        그 +1 이다. 불일치는 `409 TURN_CONFLICT` 이며 `details.currentTurnNo` 로 맞출 근거를 준다 (I-6).

        `Idempotency-Key` 를 지원한다 (R6.2). 와이어프레임의 "다시 시도"는 같은 `choiceId` 재전송이므로
        키가 없으면 Provider 가 두 번 불리고 **두 번 청구된다**.

        계정당 동시 생성은 1개다. 진행 중 요청이 있으면 `409 CONCURRENT_GENERATION` (§13-14c).
      x-implemented-by: S-9-1, S-9-2, S-9-3
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: 재전송 식별자 (R6.2). 같은 키의 재요청은 같은 응답을 돌려준다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnRequest'
      responses:
        '200':
          description: '생성된 턴. 엔딩이면 `isEnding: true` 이고 `choices` 는 빈 배열이다'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResponse'
        '400':
          $ref: '#/components/responses/InvalidChoice'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 낙관적 잠금 실패(`TURN_CONFLICT`) 또는 동시 생성(`CONCURRENT_GENERATION`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                turnConflict:
                  value:
                    error: TURN_CONFLICT
                    message: 진행 상태가 최신이 아니에요. 현재 턴으로 맞춰 주세요.
                    details:
                      currentTurnNo: 12
                      chapterNo: 4
                concurrentGeneration:
                  value:
                    error: CONCURRENT_GENERATION
                    message: 이야기를 만들고 있어요. 잠시만 기다려 주세요.
                    details: {}
        '422':
          $ref: '#/components/responses/SafetyBlocked'
        '423':
          $ref: '#/components/responses/StorySuspended'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ProviderError'
        '504':
          $ref: '#/components/responses/GenerationTimeout'

  # ── §13.6 History ───────────────────────────────────────────
  /api/v1/sessions/{sessionId}/history:
    get:
      tags: [history]
      operationId: getHistory
      summary: 지난 이야기 (화면 2e)
      description: |
        역순(최신→과거) 커서 페이지네이션이다. 화면이 "위로 스크롤해 더 읽기"이므로 이 방향이 맞다.

        **읽기 전용이므로 `choiceId` 를 반환하지 않는다.** 과거 턴의 선택지는 다시 제출될 수 없다 (I-1).
      x-implemented-by: B-35
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: 직전 응답의 `nextCursor`. 없으면 최신부터.
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 턴 기록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── §13.7 My Stories ────────────────────────────────────────
  /api/v1/me/sessions:
    get:
      tags: [me]
      operationId: getMySessions
      summary: 내 이야기 (화면 2.4)
      description: |
        `status` 값은 `play_session.status` 를 그대로 쓴다 — `active` | `completed` (§13-6).
        상위 문서의 `in_progress` 는 존재하지 않는 상태였다. `abandoned` / `expired` 는 목록에서 제외한다.
      x-implemented-by: B-36
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, completed]
          description: 생략하면 둘 다.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 내 세션 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySessionsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/me/stories:
    get:
      tags: [me]
      operationId: getMyStories
      summary: 내가 만든 작품
      description: |
        UGC 도입으로 My Stories 에 탭이 하나 늘었다 (R13.4).
        `rejectReasons` 는 **카테고리만** 담는다 — 어떤 표현이 걸렸는지는 노출하지 않는다 (R8.7).
      x-implemented-by: B-36
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 내가 만든 작품 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyStoriesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # ── §13.8 작품 만들기 ───────────────────────────────────────
  /api/v1/authoring/drafts:
    post:
      tags: [authoring]
      operationId: createDraft
      summary: 드래프트 생성
      x-implemented-by: B-51
      responses:
        '201':
          description: 새 드래프트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/authoring/drafts/{draftId}:
    patch:
      tags: [authoring]
      operationId: patchDraft
      summary: 단계별 저장
      description: |
        5단계 입력이다 (§8.1). `safetyState` 가 `blocked` 이면 **서버가 다음 단계 진행을 거부한다** (R8.3).
        클라이언트 검증에만 의존하지 않는다.
      x-implemented-by: B-51
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftPatchRequest'
      responses:
        '200':
          description: 저장된 드래프트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/authoring/drafts/{draftId}/precheck:
    post:
      tags: [authoring]
      operationId: precheckDraft
      summary: 입력 중 실시간 검수 (L0)
      description: |
        제출 후 반려가 아니라 **입력 중 피드백**이다 (R8.1). 위반 위치(`span`)와 사유를 담는다 (R8.2).

        계정당 분당 20회 제한 (R8.4).
      x-implemented-by: B-50
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrecheckRequest'
      responses:
        '200':
          description: 검수 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrecheckResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/authoring/drafts/{draftId}/outline:
    post:
      tags: [authoring]
      operationId: outlineDraft
      summary: 챕터·엔딩 AI 초안
      description: |
        챕터 5 + 엔딩 3 을 초안으로 만든다 (R7.14). **초안 결과도 검수 대상이다** (R7.15).
        조건은 사용자가 직접 쓰지 않고 **템플릿 선택만** 한다 (R7.16).

        계정당 일일 호출 상한이 있다 (R8.12).
      x-implemented-by: B-52
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          description: 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutlineResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/ProviderError'
        '504':
          $ref: '#/components/responses/GenerationTimeout'

  /api/v1/authoring/drafts/{draftId}/preview:
    post:
      tags: [authoring]
      operationId: previewDraft
      summary: 미리보기 세션 (3턴)
      description: |
        `isTestSession = true` 세션으로 만들고 3턴 후 자동 종료한다 (R8.13).
        미리보기 시점에는 정식 `story` / `storyVersion` 이 없으므로 임시 버전을 발행한다 (§13-5).
      x-implemented-by: B-53
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '201':
          description: 미리보기 세션과 턴 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/authoring/drafts/{draftId}/submit:
    post:
      tags: [authoring]
      operationId: submitDraft
      summary: 제출
      description: |
        자동 검수(L1)를 거친다. `visibility = public` 은 **인간 검수 필수**다 (R8.6).
        반려 사유는 **카테고리만** 노출한다 (R8.7).
      x-implemented-by: B-54
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
      responses:
        '202':
          description: 접수됨. 검수 결과는 review 조회로 확인한다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStatusResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/authoring/drafts/{draftId}/review:
    get:
      tags: [authoring]
      operationId: getDraftReview
      summary: 검수 상태 조회
      x-implemented-by: B-54
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          description: 검수 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/stories/{storyId}/visibility:
    patch:
      tags: [authoring]
      operationId: changeStoryVisibility
      summary: 공개 범위 변경
      description: |
        `unlisted → public` 승격은 **재검수를 강제 트리거**한다. 자동 검수만 받은 작품이
        공개 섹션에 올라오는 경로를 막는다.
      x-implemented-by: B-55
      parameters:
        - $ref: '#/components/parameters/StoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisibilityRequest'
      responses:
        '200':
          description: 변경 후 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStatusResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── §13.9 신고 ──────────────────────────────────────────────
  /api/v1/reports:
    post:
      tags: [report]
      operationId: createReport
      summary: 신고 (세이프티 L3)
      description: |
        세이프티 L3 의 **유일한 사용자 경로**다 (R13.5). Play 화면 Menu 에서 진입한다.

        동일인의 반복 신고는 누적으로 세지 않는다 — `UNIQUE(reporterRef, targetType, targetId)` (§13-9).
        IP 기준 rate limit 이 함께 걸린다 (S-8).
      x-implemented-by: B-57
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '202':
          description: 접수됨. 처리 결과는 통보하지 않는다
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 이미 신고한 대상이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ── §13.10 Landing ──────────────────────────────────────────
  /api/v1/landing:
    get:
      tags: [landing]
      operationId: getLanding
      summary: 랜딩
      description: |
        `isLoggedIn` 을 반환하지 않는다. 클라이언트가 토큰 보유로 판단한다.

        `noticeText` 는 AI 사전 고지 문구이며 **하드코딩하지 않는다** — `service_config` 에서 온다 (R11.1).
      security: []
      x-implemented-by: B-37, B-14
      responses:
        '200':
          description: 추천 작품과 고지 문구
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingResponse'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '`Authorization: Bearer <accessToken>`'

  parameters:
    StoryId:
      name: storyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SectionKey:
      name: sectionKey
      in: path
      required: true
      schema:
        type: string
      description: '`recommended` | `genre:<key>` | `community`'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  responses:
    ConsentRequired:
      description: '`birthDate` 또는 `consents[]` 누락 (§13.1)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: CONSENT_REQUIRED
            message: 가입을 계속하려면 추가 정보가 필요해요.
            details: {}
    ValidationError:
      description: 입력 검증 실패. `details.fields` 에 필드별 사유가 온다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: VALIDATION_ERROR
            message: 입력값을 확인해 주세요.
            details:
              fields:
                turnNo: must be greater than or equal to 0
    InvalidChoice:
      description: '`choiceId` 가 직전 턴이 발급한 것이 아니다 (I-1)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: INVALID_CHOICE
            message: 선택할 수 없는 항목이에요. 화면을 새로 불러와 주세요.
            details: {}
    Unauthenticated:
      description: 토큰 없음 또는 만료
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: UNAUTHENTICATED
            message: 로그인이 필요해요.
            details: {}
    AgeRestricted:
      description: 만 15세 미만 (R10.2). 계정을 만들지 않는다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: AGE_RESTRICTED
            message: 만 15세부터 이용할 수 있어요.
            details: {}
    Forbidden:
      description: 소유자가 아니거나 지금 수행할 수 없는 작업이다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: FORBIDDEN
            message: 이 작업을 수행할 권한이 없어요.
            details: {}
    NotFound:
      description: 리소스 없음. **어떤 리소스인지 밝히지 않는다** — 존재 여부 자체가 정보다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: NOT_FOUND
            message: 요청하신 정보를 찾을 수 없어요.
            details: {}
    SessionAlreadyActive:
      description: 작품당 active 세션은 1개다 (§13-9). `restart=true` 로 다시 시작할 수 있다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: SESSION_ALREADY_ACTIVE
            message: 이미 진행 중인 이야기가 있어요.
            details: {}
    SafetyBlocked:
      description: |
        Safety L2 차단 (I-2, §9.3).

        **"다시 시도"를 제공하지 않는다** (R9.5) — 동일 입력이므로 같은 결과가 나와 무한 루프가 된다.
        **차단 사유를 담지 않는다** (R9.6) — 어떤 표현이 걸렸는지 알려주면 우회 학습을 돕는다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: SAFETY_BLOCKED
            message: 이 방향으로는 이야기를 이어갈 수 없어요.
            details:
              turnNo: 12
              recoverable: true
              actions: [choose_other, leave]
    StorySuspended:
      description: 작품이 정지되어 새 턴을 만들 수 없다. 기존 기록 열람은 허용된다 (R8.10)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: STORY_SUSPENDED
            message: 지금은 이 작품을 이어갈 수 없어요.
            details: {}
    TooManyRequests:
      description: |
        **429 는 셋으로 구분한다** (§13-14d). 하나로 합치지 않는다 — 클라이언트 처리가 다르다.

        - `RETRY_COOLDOWN` — 연속 실패 3회. `details.retryAfterSeconds` 동안 재시도 비활성
        - `RATE_LIMITED` — 분당 호출 한도 초과
        - `QUOTA_EXCEEDED` — 일일 토큰·생성 한도 초과
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            retryCooldown:
              value:
                error: RETRY_COOLDOWN
                message: 잠시 후 다시 시도해 주세요.
                details:
                  retryAfterSeconds: 30
            rateLimited:
              value:
                error: RATE_LIMITED
                message: 요청이 너무 빨라요. 잠시 후 다시 시도해 주세요.
                details: {}
            quotaExceeded:
              value:
                error: QUOTA_EXCEEDED
                message: 오늘 이용할 수 있는 양을 모두 사용했어요.
                details: {}
    InternalError:
      description: |
        서버 결함. `CONTEXT_BUDGET_EXCEEDED` 는 컨텍스트 예산 초과이며 **조용히 잘라내지 않고 실패시킨다** (§4.4).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internal:
              value:
                error: INTERNAL_ERROR
                message: 일시적인 문제가 발생했어요.
                details: {}
            contextBudget:
              value:
                error: CONTEXT_BUDGET_EXCEEDED
                message: 일시적인 문제가 발생했어요.
                details: {}
    ProviderError:
      description: Provider 실패 또는 스키마 파싱 재요청 실패 (R3.3, R5.8)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: PROVIDER_ERROR
            message: 이야기를 만들지 못했어요. 잠시 후 다시 시도해 주세요.
            details: {}
    GenerationTimeout:
      description: 생성 예산 초과 (R6.4). **세션 상태는 변하지 않는다** (R6.6)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: GENERATION_TIMEOUT
            message: 이야기를 만드는 데 시간이 너무 오래 걸렸어요.
            details: {}

  schemas:

    # ── 공통 ────────────────────────────────────────────────
    ErrorCode:
      type: string
      description: |
        서버가 내보내는 모든 에러의 `error` 값. `com.neowadaeum.common.error.ErrorCode` 와 **정확히 일치**한다.
        스펙에 없는 코드를 만들지 않는다.
      enum:
        - CONSENT_REQUIRED
        - INVALID_CHOICE
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - AGE_RESTRICTED
        - FORBIDDEN
        - NOT_FOUND
        - TURN_CONFLICT
        - CONCURRENT_GENERATION
        - SESSION_ALREADY_ACTIVE
        - SAFETY_BLOCKED
        - STORY_SUSPENDED
        - RETRY_COOLDOWN
        - RATE_LIMITED
        - QUOTA_EXCEEDED
        - CONTEXT_BUDGET_EXCEEDED
        - INTERNAL_ERROR
        - PROVIDER_ERROR
        - GENERATION_TIMEOUT

    Error:
      type: object
      description: |
        **모든 에러가 이 형태 하나로 수렴한다.**

        스택트레이스·예외 클래스명·SQL·내부 경로·세이프티 차단 사유·거절된 입력 원문을 담지 않는다 (S-6, R9.6, S-3).
        클라이언트는 `error` 코드로 문구를 매핑한다. 서버 `message` 를 UI 에 그대로 쓴다고 가정하지 않는다.
      required: [error, message, details]
      properties:
        error:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 안전한 폴백 문구
        details:
          type: object
          additionalProperties: true
          description: 코드별 부가 정보. **`null` 이 되지 않는다** — 값이 없으면 빈 객체다

    AuthorType:
      type: string
      enum: [official, user]
      description: 공식 작품과 사용자 작품을 같은 섹션에 섞지 않는 근거 (R13.1)

    Visibility:
      type: string
      enum: [private, unlisted, public]

    ReviewStatus:
      type: string
      description: |
        `draft → pending → (auto_rejected | in_review) → (approved | rejected)`,
        `approved → suspended → (approved | rejected)` (§13-9).
        `auto_rejected` 는 내부 기록이며 사용자에게는 `rejected` 로 표시한다.
      enum: [draft, pending, auto_rejected, in_review, approved, rejected, suspended]

    # ── §13.1 인증 ──────────────────────────────────────────
    OAuthLoginRequest:
      type: object
      description: |
        `birthDate` / `consents` 는 **최초 로그인(가입)에만** 필요하다. 기존 회원은 `idToken` 만 보낸다.
        누락이면 `400 CONSENT_REQUIRED` 로 무엇이 더 필요한지 알린다.
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Provider 가 발급한 ID 토큰. 서버가 검증한다
        birthDate:
          type: [string, 'null']
          format: date
          description: 만 나이 계산은 KST 기준이다. 원본을 저장한다(생일 경과 처리)
        consents:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ConsentItem'

    ConsentItem:
      type: object
      required: [consentType, version, agreed]
      properties:
        consentType:
          type: string
          enum: [tos, privacy, ai_notice, age]
        version:
          type: string
        agreed:
          type: boolean

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenResponse:
      type: object
      description: '`playerRef` 를 반환하지 않는다. 클라이언트가 알 필요가 없다'
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: 액세스 토큰 만료까지 남은 초

    # ── §13.2 Library ───────────────────────────────────────
    LibraryResponse:
      type: object
      required: [genres, sections, continueSessions]
      properties:
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/LibrarySection'
        continueSessions:
          type: array
          items:
            $ref: '#/components/schemas/ContinueSession'

    Genre:
      type: object
      required: [genreId, label]
      properties:
        genreId:
          type: string
        label:
          type: string

    LibrarySection:
      type: object
      required: [sectionKey, sectionTitle, hasMore, stories]
      properties:
        sectionKey:
          type: string
          description: '`recommended` | `genre:<key>` | `community`'
        sectionTitle:
          type: string
        hasMore:
          type: boolean
        stories:
          type: array
          items:
            $ref: '#/components/schemas/StoryCard'
        nextCursor:
          type: [string, 'null']

    StoryCard:
      type: object
      required: [storyId, title, coverImage, genres, shortDescription, isNew, authorType]
      properties:
        storyId:
          type: string
          format: uuid
        title:
          type: string
        coverImage:
          type: [string, 'null']
          description: 2:3 비율
        genres:
          type: array
          items:
            type: string
        shortDescription:
          type: string
          description: 40자 이하
        isNew:
          type: boolean
        authorType:
          $ref: '#/components/schemas/AuthorType'

    ContinueSession:
      type: object
      description: 진행률을 백분율로 주지 않는다 (R13.2)
      required: [sessionId, storyId, title, coverImage, chapterNo, chapterTitle, totalChapters, lastSceneSummary, updatedAt]
      properties:
        sessionId:
          type: string
          format: uuid
        storyId:
          type: string
          format: uuid
        title:
          type: string
        coverImage:
          type: [string, 'null']
        chapterNo:
          type: integer
        chapterTitle:
          type: [string, 'null']
        totalChapters:
          type: integer
        lastSceneSummary:
          type: [string, 'null']
        updatedAt:
          type: string
          format: date-time

    # ── §13.3 Story Detail ──────────────────────────────────
    StoryDetailResponse:
      type: object
      required: [story, characters, mySession]
      properties:
        story:
          $ref: '#/components/schemas/StoryDetail'
        characters:
          type: array
          description: 빈 배열이면 클라이언트가 섹션을 숨긴다
          items:
            $ref: '#/components/schemas/CharacterCard'
        mySession:
          oneOf:
            - $ref: '#/components/schemas/MySessionBrief'
            - type: 'null'

    StoryDetail:
      type: object
      required: [storyId, title, heroImage, genres, description, worldIntro, ageRating, authorType, authorDisplayName, totalChapters, totalEndings]
      properties:
        storyId:
          type: string
          format: uuid
        title:
          type: string
        heroImage:
          type: [string, 'null']
        genres:
          type: array
          items:
            type: string
        description:
          type: string
        worldIntro:
          type: string
        ageRating:
          type: string
          const: 15세 이용가
          description: '**상수다** (R10.1, I-19). 작품별 등급 컬럼을 두지 않는다'
        authorType:
          $ref: '#/components/schemas/AuthorType'
        authorDisplayName:
          type: [string, 'null']
          description: UGC 작성자 닉네임 (§13-7). **`playerRef` 를 노출하지 않는다**
        totalChapters:
          type: integer
        totalEndings:
          type: integer
          description: '`isSecret = false` 인 엔딩만 센다 (R7.11)'

    CharacterCard:
      type: object
      required: [characterId, name, role, portraitImage, oneLine]
      properties:
        characterId:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: [string, 'null']
        portraitImage:
          type: [string, 'null']
        oneLine:
          type: [string, 'null']

    MySessionBrief:
      type: object
      required: [sessionId, chapterNo, chapterTitle, lastSceneSummary]
      properties:
        sessionId:
          type: string
          format: uuid
        chapterNo:
          type: integer
        chapterTitle:
          type: [string, 'null']
        lastSceneSummary:
          type: [string, 'null']

    # ── §13.4 Session ───────────────────────────────────────
    StartSessionResponse:
      type: object
      description: 턴 1 이 함께 온다. 시작 직후 별도 턴 요청이 필요 없다
      required: [sessionId, turn]
      properties:
        sessionId:
          type: string
          format: uuid
        turn:
          $ref: '#/components/schemas/TurnResponse'

    SessionState:
      type: string
      description: |
        `valid` 만 이어하기가 가능하다.
        `version_changed` 는 세션이 고정 참조하는 버전이 `story.currentVersionId` 와 달라진 경우다 (R2.1).
        `story_suspended` 는 UGC 정지다 (R13.3).
      enum: [valid, expired, deleted, version_changed, story_suspended]

    ResumeResponse:
      type: object
      required: [sessionId, storyId, title, chapterNo, chapterTitle, totalChapters, turnNo, updatedAt, lastSceneVisual, lastSceneSummary, lastChoiceText, sessionState, canViewHistory]
      properties:
        sessionId:
          type: string
          format: uuid
        storyId:
          type: string
          format: uuid
        title:
          type: string
        chapterNo:
          type: integer
        chapterTitle:
          type: [string, 'null']
        totalChapters:
          type: integer
        turnNo:
          type: integer
        updatedAt:
          type: string
          format: date-time
        lastSceneVisual:
          type: [string, 'null']
        lastSceneSummary:
          type: [string, 'null']
        lastChoiceText:
          type: [string, 'null']
        sessionState:
          $ref: '#/components/schemas/SessionState'
        canViewHistory:
          type: boolean

    # ── §13.5 Turn ──────────────────────────────────────────
    TurnRequest:
      type: object
      description: |
        **사용자 입력면은 이 둘뿐이다.** 플레이 중 자유입력이 없고(I-18), 선택지는 서버가 발급한
        `choiceId` 로만 제출된다 (I-1). 선택지 텍스트를 받는 필드를 두지 않는다.
      required: [choiceId, turnNo]
      properties:
        choiceId:
          type: string
          description: |
            직전 턴이 발급한 선택지 식별자. 형식은 `{turnNo}-{order}-{shortHash}` 이며 세션 안에서 유일하다.
            **이전 턴의 `choiceId` 는 재사용할 수 없다** (§13-9).
          examples: ['12-2-1a2b3c4d']
        turnNo:
          type: integer
          minimum: 0
          description: '**지금 화면에 떠 있는 턴**의 번호. 낙관적 잠금 키다 (I-6)'

    TurnResponse:
      type: object
      description: |
        `progressPercent` 를 만들지 않는다 (R7.5) — AI 생성이라 챕터당 턴 수가 가변이므로 백분율에 근거가 없다.

        엔딩이면 `isEnding: true` 이고 `choices` 는 **빈 배열**이다 (R7.8).
      required: [turnNo, chapterNo, chapterTitle, chapterChanged, progressHint, speakerName, paragraphs, choices, isEnding, endingId, endingIndex, totalEndings]
      properties:
        turnNo:
          type: integer
          description: '**요청값 + 1** 이다 (§13-14e)'
        chapterNo:
          type: integer
          description: '**서버가 판정한** 챕터. AI 제안값은 반영하지 않는다 (I-9, I-10)'
        chapterTitle:
          type: [string, 'null']
        chapterChanged:
          type: boolean
          description: 전환 시 클라이언트가 인터스티셜을 띄운다 (R7.3)
        progressHint:
          type: [string, 'null']
          examples: ['Chapter 4 / 전체 6장']
        speakerName:
          type: [string, 'null']
          description: 턴의 대표 화자. 없으면 나레이션만 있는 턴이다
        paragraphs:
          type: array
          description: '**통 문자열이 아니라 문단 배열이다** (R5.1). 대사와 나레이션을 다르게 렌더한다 (R5.2)'
          items:
            $ref: '#/components/schemas/Paragraph'
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
        isEnding:
          type: boolean
        endingId:
          type: [string, 'null']
          format: uuid
        endingIndex:
          type: [integer, 'null']
          description: 비시크릿 기준 순번. 시크릿 엔딩이면 `null` 이다 (R7.11)
        totalEndings:
          type: [integer, 'null']
          description: 비시크릿 엔딩 수 (R7.11)
        sceneImage:
          type: [string, 'null']
          description: 아직 발행하지 않는다
          x-implemented-by: P3
        savedAt:
          type: [string, 'null']
          format: date-time
          x-implemented-by: B-17
        isAiGenerated:
          type: [boolean, 'null']
          description: '상수 `true` 가 아니라 **실제 생성 경로를 반영한다** (R11.2)'
          x-implemented-by: B-14
        canViewHistory:
          type: [boolean, 'null']
          x-implemented-by: B-35
        endingLabel:
          type: [string, 'null']
          x-implemented-by: B-17
        epilogueText:
          type: [string, 'null']
          x-implemented-by: B-17
        reachRate:
          type: [number, 'null']
          description: |
            도달률. **배치 갱신값이다** (I-20, R2.7). 표본이 적으면 `null` 을 반환한다 (R2.8).
          x-implemented-by: B-39
        stats:
          oneOf:
            - $ref: '#/components/schemas/EndingStats'
            - type: 'null'
          x-implemented-by: B-17
        replayable:
          type: [boolean, 'null']
          x-implemented-by: B-17

    Paragraph:
      type: object
      required: [type, speakerName, text]
      properties:
        type:
          type: string
          enum: [dialogue, narration]
        speakerName:
          type: [string, 'null']
          description: '`null` 이면 나레이션으로 렌더한다 (R5.2)'
        text:
          type: string

    Choice:
      type: object
      description: |
        `choiceId` 는 **서버가 발급한 값이다** (I-1). 다음 요청은 이것만 보낸다.

        `disabled` 도 **서버가 판정한다** (I-11). P0 채택안대로 항상 `false` 이고 `disabledReason` 은
        `null` 이지만 **필드는 유지한다** — 프론트 계약 안정성 때문이다 (§13-3).
      required: [choiceId, order, text, disabled, disabledReason]
      properties:
        choiceId:
          type: string
        order:
          type: integer
          minimum: 1
        text:
          type: string
        disabled:
          type: boolean
        disabledReason:
          type: [string, 'null']

    EndingStats:
      type: object
      required: [chapters, turns, choices]
      properties:
        chapters:
          type: integer
        turns:
          type: integer
        choices:
          type: integer

    # ── §13.6 History ───────────────────────────────────────
    HistoryResponse:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    HistoryItem:
      type: object
      description: '**`choiceId` 를 반환하지 않는다.** 읽기 전용이다'
      required: [turnNo, chapterNo, chapterTitle, speakerName, paragraphs, chosenChoiceText, isPending]
      properties:
        turnNo:
          type: integer
        chapterNo:
          type: integer
        chapterTitle:
          type: [string, 'null']
        speakerName:
          type: [string, 'null']
        paragraphs:
          type: array
          items:
            $ref: '#/components/schemas/Paragraph'
        chosenChoiceText:
          type: [string, 'null']
        isPending:
          type: boolean
          description: '마지막 턴이며 아직 선택이 이뤄지지 않은 경우 `true` (§13-9)'

    # ── §13.7 My Stories ────────────────────────────────────
    MySessionsResponse:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MySessionItem'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    MySessionItem:
      type: object
      required: [sessionId, storyId, title, coverImage, status, chapterNo, totalChapters, updatedAt]
      properties:
        sessionId:
          type: string
          format: uuid
        storyId:
          type: string
          format: uuid
        title:
          type: string
        coverImage:
          type: [string, 'null']
        status:
          type: string
          enum: [active, completed]
          description: '§13-6 정정. `in_progress` 는 존재하지 않는 상태였다'
        chapterNo:
          type: integer
        totalChapters:
          type: integer
        updatedAt:
          type: string
          format: date-time

    MyStoriesResponse:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyStoryItem'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    MyStoryItem:
      type: object
      required: [storyId, title, coverImage, visibility, reviewStatus, rejectReasons, playCount, updatedAt]
      properties:
        storyId:
          type: string
          format: uuid
        title:
          type: string
        coverImage:
          type: [string, 'null']
        visibility:
          $ref: '#/components/schemas/Visibility'
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        rejectReasons:
          type: array
          description: '**카테고리만** 담는다. 어떤 표현이 걸렸는지는 노출하지 않는다 (R8.7)'
          items:
            type: string
        playCount:
          type: integer
        updatedAt:
          type: string
          format: date-time

    # ── §13.8 작품 만들기 ───────────────────────────────────
    SafetyState:
      type: string
      enum: [clean, warned, blocked]

    DraftResponse:
      type: object
      required: [draftId, step, safetyState, findings, updatedAt]
      properties:
        draftId:
          type: string
          format: uuid
        storyId:
          type: [string, 'null']
          format: uuid
        step:
          type: integer
          minimum: 1
          maximum: 5
        payload:
          type: object
          additionalProperties: true
          description: 단계별 입력 원문 (§8.1)
        safetyState:
          $ref: '#/components/schemas/SafetyState'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        updatedAt:
          type: string
          format: date-time

    DraftPatchRequest:
      type: object
      required: [step, payload]
      properties:
        step:
          type: integer
          minimum: 1
          maximum: 5
        payload:
          type: object
          additionalProperties: true

    PrecheckRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: object
          additionalProperties:
            type: string
          description: 검사할 필드 경로 → 값. 예 `characters[0].name`

    PrecheckResponse:
      type: object
      required: [state, findings]
      properties:
        state:
          $ref: '#/components/schemas/SafetyState'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'

    Finding:
      type: object
      description: |
        위반 **위치와 사유**를 담는다 (R8.2). "부적절한 내용입니다"가 아니라 무엇이 문제인지 보여야 한다.

        단 **걸린 항목 자체는 담지 않는다** — 우회 학습을 돕는다 (R8.7, S-11).
      required: [field, span, kind, message]
      properties:
        field:
          type: string
          examples: ['characters[0].name']
        span:
          type: array
          description: '[시작, 끝) 문자 오프셋'
          items:
            type: integer
          minItems: 2
          maxItems: 2
        kind:
          type: string
          enum: [real_person, ip_violation, sexual, violence, hate, personal_data, other]
        message:
          type: string

    OutlineResponse:
      type: object
      required: [chapters, endings]
      properties:
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/OutlineChapter'
        endings:
          type: array
          items:
            $ref: '#/components/schemas/OutlineEnding'

    OutlineChapter:
      type: object
      required: [chapterNo, title, summarySeed]
      properties:
        chapterNo:
          type: integer
        title:
          type: string
        summarySeed:
          type: string
        conditionTemplateKey:
          type: [string, 'null']
          description: 조건은 **템플릿 선택만** 한다 (R7.16). 사용자가 DSL 을 직접 쓰지 않는다

    OutlineEnding:
      type: object
      required: [endingNo, label, isDefault]
      properties:
        endingNo:
          type: integer
        label:
          type: string
        epilogueText:
          type: [string, 'null']
        isDefault:
          type: boolean
          description: |
            기본 엔딩은 조건을 갖지 않고, 일반 엔딩은 조건을 반드시 갖는다 (R2.11, §13-16).
        conditionTemplateKey:
          type: [string, 'null']

    SubmitRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: '#/components/schemas/Visibility'

    VisibilityRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: '#/components/schemas/Visibility'

    ReviewStatusResponse:
      type: object
      description: |
        검수 **비율·임계값을 노출하지 않는다.** 값을 알면 그 아래로 관리할 수 있다 (§13-12, S-11).
      required: [storyId, reviewStatus, visibility, rejectReasons, updatedAt]
      properties:
        storyId:
          type: [string, 'null']
          format: uuid
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        visibility:
          $ref: '#/components/schemas/Visibility'
        rejectReasons:
          type: array
          description: '카테고리만 (R8.7)'
          items:
            type: string
        updatedAt:
          type: string
          format: date-time

    # ── §13.9 신고 ──────────────────────────────────────────
    ReportRequest:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType:
          type: string
          enum: [turn, story]
        targetId:
          type: string
        sessionId:
          type: [string, 'null']
          format: uuid
        turnNo:
          type: [integer, 'null']
        reason:
          type: string
          enum: [inappropriate, ip_violation, real_person, other]
        detail:
          type: [string, 'null']

    # ── §13.10 Landing ──────────────────────────────────────
    LandingResponse:
      type: object
      description: '`isLoggedIn` 을 반환하지 않는다. 클라이언트가 토큰 보유로 판단한다'
      required: [featuredStories, noticeText]
      properties:
        featuredStories:
          type: array
          items:
            $ref: '#/components/schemas/FeaturedStory'
        noticeText:
          type: string
          description: AI 사전 고지 문구. **하드코딩하지 않는다** — `service_config` 에서 온다 (R11.1)

    FeaturedStory:
      type: object
      required: [storyId, title, coverImage]
      properties:
        storyId:
          type: string
          format: uuid
        title:
          type: string
        coverImage:
          type: [string, 'null']
