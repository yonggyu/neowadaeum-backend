name: 세이프티 (Safety)
description: 검수 오탐·미탐, 세이프티 파이프라인 결함
title: "[SAFETY] "
labels: ["safety", "P0"]
body:
  - type: markdown
    attributes:
      value: |
        ## 먼저 읽으세요

        **이 이슈에 우회 방법을 적지 마세요.** 레포가 공개 전환될 수 있고, 이슈 본문은 영구히 남습니다.

        적지 말 것:
        - 검수를 통과한 구체적 입력 문자열·프롬프트
        - 블록리스트에서 어떤 항목이 걸렸는지 / 걸리지 않았는지
        - 정규화를 우회하는 표기법 (자모 분리·유사 문자 치환 예시)
        - 차단된 생성물의 본문

        대신 **세션 ID·턴 번호·`ai_call_log` id**로 지목하세요. 원문은 접근 권한이 있는 사람이 로그에서 확인합니다 (R9.6, S-3, S-5).

  - type: dropdown
    id: layer
    attributes:
      label: 계층
      options:
        - "L0 — 입력 중 실시간 검수 (precheck)"
        - "L1 — 제출 시 검수 (UGC 전체 / 관리자 자유입력)"
        - "L2 — AI 응답 직후 검수"
        - "L3 — 신고 · 샘플링"
        - "계층 불명 / 파이프라인 전반"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 유형
      options:
        - "미탐 (통과되면 안 될 것이 통과됨)"
        - "오탐 (정상 콘텐츠가 차단됨)"
        - "파이프라인 결함 (재생성 루프, 판정기 미호출, 기록 누락 등)"
        - "정책 자체에 대한 문제 제기"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 관련 카테고리
      description: CLAUDE.md §9.2 기준
      options:
        - 미성년자 성적 콘텐츠
        - 실존 인물 성적 / 명예훼손
        - 비동의 성행위
        - 기존 IP 캐릭터·설정 복제
        - 15세 등급 초과 (선정성·폭력성)
        - 혐오 표현
        - 타인 개인정보
        - 해당 없음 / 불명
    validations:
      required: true

  - type: input
    id: ids
    attributes:
      label: 식별자
      description: 원문을 적는 대신 이것으로 지목합니다
      placeholder: sessionId=..., turnNo=12, aiCallLogId=..., draftId=...
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 상황 설명
      description: 원문 없이, 무슨 일이 일어났는지 서술로만
      placeholder: |
        L2가 blocked를 반환했으나 재생성이 2회 발생했다.
        즉시차단 카테고리인데 §4.8에 따르면 재생성 없이 차단되어야 한다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 처리
      description: 근거가 되는 요구사항 ID
      placeholder: R9.1 / R9.5 / I-12 / §4.8

  - type: checkboxes
    id: confirm
    attributes:
      label: 확인
      options:
        - label: 이 이슈에 우회 방법·구체적 입력 문자열·차단된 본문을 적지 않았다
          required: true
        - label: 블록리스트의 어떤 항목이 걸렸는지 적지 않았다
          required: true
        - label: 사용자 개인정보를 적지 않았다
          required: true
