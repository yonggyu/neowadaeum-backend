# ─────────────────────────────────────────────────────────────
# nightly 검증 (ADR-0001)
#
# ★ 이 워크플로는 브랜치 보호의 **필수 status check 가 아니다.**
#   필수 체크는 ci.yml 의 build / test / gitleaks 3개뿐이며 그 이름을 바꾸지 않는다
#   (docs/branch-protection.md). nightly 를 필수로 걸면 스케줄 실행이 없는 PR 이
#   영원히 pending 으로 남아 머지가 막힌다.
#
# ★ 여기서 도는 것은 "안 돌리는 테스트"가 아니라 "PR 마다는 안 돌리는 테스트"다.
#   분류 근거 · 승격 시점 · 복귀 조건은 docs/adr/0001-mvp-test-execution-policy.md 에 있다.
#
# ※ §7.2 — `.github/**/*.yml` 은 `*.yml` 전면 무시의 예외다. 시크릿을 넣지 않는다.
# ─────────────────────────────────────────────────────────────
name: nightly

on:
  schedule:
    # 매일 18:00 UTC = 03:00 KST. 작업 시간과 겹치지 않는 시각을 고른다.
    - cron: "0 18 * * *"
  workflow_dispatch:

# 실패를 이슈로 남겨야 하므로 issues: write 가 필요하다. 그 외에는 읽기만 한다.
permissions:
  contents: read
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    name: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: backend
          persist-credentials: false

      - name: JDK 21 (temurin) + Gradle 캐시
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: application.yml 준비
        run: cp src/main/resources/application.yml.template src/main/resources/application.yml

      # Ryuk 을 끄지 않는다. 로컬에서는 0.5초를 아끼려고 끌 수 있지만(README),
      # 러너에서 끄면 크래시한 실행의 고아 컨테이너가 남는다.
      - name: nightly 테스트
        run: ./gradlew nightlyTest --no-daemon

      # 성공해도 올린다 — 실측치는 **실패의 증거가 아니라 결과물**이다 (B-46).
      # 실패 시에만 올리면 잰 값을 아무도 보지 못한다.
      - name: 부하 실측 결과
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-report
          path: build/perf
          if-no-files-found: ignore
          retention-days: 30

      # 회차 하나만으로는 백분위를 말할 수 없다 (#255). 매 회차를 **누적 표에 한 줄**로 쌓아
      # 회차 간 비교가 손으로 옮겨 적는 일이 되지 않게 한다.
      #
      # 왜 이슈인가 — 아티팩트는 30일 뒤에 사라지고, 레포에 커밋하려면 이 워크플로에 쓰기
      # 권한과 보호 브랜치 우회가 필요하다. 이슈는 둘 다 없이 남는다.
      #
      # 열 정의는 이 파일이 아니라 테스트가 갖는다. 여기서 아는 것은 "앞 두 줄은 머리글,
      # 마지막 줄은 이번 회차"뿐이다 — 열이 늘어도 이 스텝을 고치지 않는다.
      - name: 회차 누적
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const source = 'build/perf/turn-latency-run.md';
            if (!fs.existsSync(source)) {
              core.info('회차 파일이 없다 — 측정이 돌지 않은 실행이다.');
              return;
            }
            const lines = fs.readFileSync(source, 'utf8').trim().split('\n');
            const header = lines.slice(0, 2);
            const row = lines[lines.length - 1];

            const title = '지연 실측 회차 누적 (B-46)';
            const intro = [
              '`TurnLatencyNightlyTests` 가 nightly 마다 잰 값을 한 줄씩 쌓는다 (#255).',
              '',
              '**손으로 고치지 않는다** — 다음 회차가 이 본문을 통째로 다시 쓴다.',
              '판단이 달라진 회차만 `docs/perf/turn-latency.md` 로 옮겨 적는다.',
              '',
              '숫자는 **Provider 인위 지연을 뺀 서버 몫**이다. 전체 지연은 여기에 `Provider ms` 를 더한 값이다.',
              '조건 열(표본 · 동시성 · Provider ms)이 다른 회차는 **같은 열에서 비교하지 않는다.**',
              '',
            ];

            // 365 회차 = 1년. 이슈 본문에는 길이 제한이 있고, 그보다 오래된 회차는 표가 아니라
            // 문서가 기억해야 할 값이다.
            const KEEP = 365;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'area:infra',
              per_page: 100,
            });
            const hit = open.find((issue) => issue.title === title);

            const previous = (hit && hit.body) ? hit.body.split('\n') : [];
            const separator = previous.findIndex((line) => line.startsWith('|---'));
            const kept = (separator < 0)
              ? []
              : previous.slice(separator + 1).filter((line) => line.startsWith('| '));
            const body = intro.concat(header, kept.concat([row]).slice(-KEEP)).join('\n');

            if (hit) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hit.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['area:infra'],
              });
            }

      - name: 테스트 리포트 (실패 시에만)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-report
          path: build/reports/tests/nightlyTest
          retention-days: 14

      # 아무도 안 보는 nightly 는 없는 것과 같다. 실패를 이슈로 만든다.
      # 같은 제목의 열린 이슈가 있으면 코멘트만 남긴다 — 매일 새 이슈가 쌓이면 그것도 안 보게 된다.
      - name: 실패 시 이슈 등록
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = 'nightly 검증 실패';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'nightly 워크플로가 실패했다.',
              '',
              '| | |',
              '|---|---|',
              `| 실행 | ${url} |`,
              `| 커밋 | \`${context.sha}\` |`,
              '',
              '여기서 도는 것은 §10.1 의 필수 테스트 중 nightly 로 분류된 항목이다',
              '(docs/adr/0001-mvp-test-execution-policy.md).',
              '**PR 마다 안 돈다는 뜻이지 안 돌린다는 뜻이 아니다.**',
              '실패를 방치하면 그 분류가 곧 검증 축소가 된다.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug',
              per_page: 100,
            });
            const hit = existing.data.find((issue) => issue.title === title);

            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hit.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'P1', 'area:infra'],
              });
            }
