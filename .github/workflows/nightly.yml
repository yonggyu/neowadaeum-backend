# ─────────────────────────────────────────────────────────────
# nightly 검증 (ADR-0001)
#
# ★ 이 워크플로는 브랜치 보호의 **필수 status check 가 아니다.**
#   필수 체크는 ci.yml 의 build / test / gitleaks 3개뿐이며 그 이름을 바꾸지 않는다
#   (docs/branch-protection.md). nightly 를 필수로 걸면 스케줄 실행이 없는 PR 이
#   영원히 pending 으로 남아 머지가 막힌다.
#
# ★ 여기서 도는 것은 "안 돌리는 테스트"가 아니라 "PR 마다는 안 돌리는 테스트"다.
#   분류 근거 · 승격 시점 · 복귀 조건은 docs/adr/0001-mvp-test-execution-policy.md 에 있다.
#
# ※ §7.2 — `.github/**/*.yml` 은 `*.yml` 전면 무시의 예외다. 시크릿을 넣지 않는다.
# ─────────────────────────────────────────────────────────────
name: nightly

on:
  schedule:
    # 매일 18:00 UTC = 03:00 KST. 작업 시간과 겹치지 않는 시각을 고른다.
    - cron: "0 18 * * *"
  workflow_dispatch:

# 실패를 이슈로 남겨야 하므로 issues: write 가 필요하다. 그 외에는 읽기만 한다.
permissions:
  contents: read
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    name: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: backend
          persist-credentials: false

      - name: JDK 21 (temurin) + Gradle 캐시
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: application.yml 준비
        run: cp src/main/resources/application.yml.template src/main/resources/application.yml

      # Ryuk 을 끄지 않는다. 로컬에서는 0.5초를 아끼려고 끌 수 있지만(README),
      # 러너에서 끄면 크래시한 실행의 고아 컨테이너가 남는다.
      - name: nightly 테스트
        run: ./gradlew nightlyTest --no-daemon

      # 성공해도 올린다 — 실측치는 **실패의 증거가 아니라 결과물**이다 (B-46).
      # 실패 시에만 올리면 잰 값을 아무도 보지 못한다.
      - name: 부하 실측 결과
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-report
          path: build/perf
          if-no-files-found: ignore
          retention-days: 30

      - name: 테스트 리포트 (실패 시에만)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-report
          path: build/reports/tests/nightlyTest
          retention-days: 14

      # 아무도 안 보는 nightly 는 없는 것과 같다. 실패를 이슈로 만든다.
      # 같은 제목의 열린 이슈가 있으면 코멘트만 남긴다 — 매일 새 이슈가 쌓이면 그것도 안 보게 된다.
      - name: 실패 시 이슈 등록
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = 'nightly 검증 실패';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'nightly 워크플로가 실패했다.',
              '',
              '| | |',
              '|---|---|',
              `| 실행 | ${url} |`,
              `| 커밋 | \`${context.sha}\` |`,
              '',
              '여기서 도는 것은 §10.1 의 필수 테스트 중 nightly 로 분류된 항목이다',
              '(docs/adr/0001-mvp-test-execution-policy.md).',
              '**PR 마다 안 돈다는 뜻이지 안 돌린다는 뜻이 아니다.**',
              '실패를 방치하면 그 분류가 곧 검증 축소가 된다.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug',
              per_page: 100,
            });
            const hit = existing.data.find((issue) => issue.title === title);

            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hit.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'P1', 'area:infra'],
              });
            }
