# ─────────────────────────────────────────────────────────────
# **로컬 개발 전용이다.** `spring-boot-docker-compose` 가 `./gradlew bootRun` 마다 이 파일을
# 띄운다(§2.5) — 여기에 앱·프론트·프록시를 더하면 개발자의 8080 앞에 프록시가 서고, 왜 그런지
# 모르는 채로 디버깅하게 된다.
#
# **배포 위상은 `docker-compose.deploy.yml` 이다** (이슈 #448, `docs/deployment.md` §5).
# 두 파일을 `-f` 로 겹쳐 쓰지 않는다.
# ─────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    container_name: neowadaeum-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      # ↓ docker/postgres/init/01-init-schemas.sh 가 스키마별 계정을 만들 때 쓴다.
      #   여기서 넘기지 않으면 빈 비밀번호로 ROLE이 생성되어 앱이 접속하지 못한다.
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      PLAY_DB_PASSWORD: ${PLAY_DB_PASSWORD}
      PROMPTLOG_DB_PASSWORD: ${PROMPTLOG_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: neowadaeum-redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
